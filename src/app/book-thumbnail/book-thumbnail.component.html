<mdc-card class="book-thumbnail">
  <mdc-card-primary-action (click)="viewVolume(volume.id)" 
                            class="book-thumbnail__media">
    <img *ngIf="volume.volumeInfo.imageLinks" 
          src="{{volume.volumeInfo.imageLinks.thumbnail?
          volume.volumeInfo.imageLinks.thumbnail:
          volume.volumeInfo.imageLinks.smallThumbnail}}">
    <mdc-card-media-content class="book-thumbnail__media-content--with-title">
      <div class="book-thumbnail__media-info">
        <div class="book-thumbnail__media-title" mdcSubtitle1>
          {{volume.volumeInfo.title}}
        </div>
        <div class="book-thumbnail__media-author" mdcSubtitle2>
          {{volume.volumeInfo.authors}}
        </div>
      </div>
    </mdc-card-media-content>
  </mdc-card-primary-action>

  <!-- Ikony serduszka i zakładki: tylko w wynikach wyszukiwania (karta nie należy do żadnej półki).
       Ikona wypełniona = książka jest na półce, ikona pusta = nie ma jej. -->
  <mdc-card-actions *ngIf="shelfId === undefined">
    <button mdcIconButton mdcCardAction="icon" 
                          [disabled]="isBusy" 
                          (click)="toggleFavorite()"
                          [attr.aria-label]="inFavorites ? 'Remove from Favorites' : 'Add to Favorites'"
                          [attr.aria-pressed]="inFavorites">
      <mdc-icon>{{ inFavorites ? 'favorite' : 'favorite_border' }}</mdc-icon>
    </button>
    <button mdcIconButton mdcCardAction="icon" 
                          [disabled]="isBusy" 
                          (click)="toggleToRead()"
                          [attr.aria-label]="inToRead ? 'Remove from To read' : 'Add to To read'"
                          [attr.aria-pressed]="inToRead">
      <mdc-icon>{{ inToRead ? 'bookmark' : 'bookmark_border' }}</mdc-icon>
    </button>
  </mdc-card-actions>

  <!-- Przycisk usuwania widoczny tylko na półkach, z których wolno usuwać książki. -->
  <mdc-card-actions *ngIf="canRemove">
    <button mdc-button (click)="removeFromShelf()">Remove</button>
  </mdc-card-actions>

  <p *ngIf="statusMessage" class="book-thumbnail__status">{{ statusMessage }}</p>
</mdc-card>
